<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Behavior Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fdfaf7;
      color: #2c1d0c;
      margin: 0;
      padding: 0;
    }
    h1, h2 {
      text-align: center;
      color: #4b3621;
      margin-bottom: 20px;
    }
    .sticky-header {
      background-color: #fdfaf7;
      border-bottom: 1px solid #d1bfa6;
      padding: 20px;
    }
    .form-row-horizontal {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      margin-bottom: 10px;
      align-items: center;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      align-items: start;
    }
    .form-group label {
      font-weight: 600;
      margin-bottom: 5px;
    }
    .form-group input,
    .form-group select {
      padding: 8px;
      border: 1px solid #c1a98d;
      border-radius: 5px;
      min-width: 200px;
    }
    .hidden {
      display: none;
    }
    .table-container {
      overflow: auto;
      max-height: 500px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 20px auto;
      background-color: #fff;
      table-layout: fixed;
    }
    th, td {
      border: 1px solid #d1bfa6;
      text-align: center;
      padding: 0;
      height: 40px;
    }
    th input, td input {
      width: 100%;
      height: 100%;
      border: none;
      padding: 10px;
      text-align: center;
      box-sizing: border-box;
    }
    th {
      background-color: #e8d6c2;
      color: #2c1d0c;
    }
    .day-col {
      background-color: #f0e3d4;
      font-weight: bold;
    }
    .button-container {
      text-align: center;
      margin: 30px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 20px;
      background-color: #6b4c32;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover {
      background-color: #8d6243;
    }
    .negative-balance {
      background-color: #ffe5e5 !important;
      border: 2px solid #cc0000;
    }
  </style>
</head>
<body>

  <div class="sticky-header">
    <h1>Behavior Tracker Form</h1>
    <div class="form-row-horizontal">
      <div class="form-group">
        <label for="clientName">Client Name:</label>
        <input type="text" id="clientName" />
      </div>

      <div class="form-group">
        <label for="program">Program:</label>
        <select id="program" onchange="toggleOtherProgram()">
          <option value="">-- Select Program --</option>
          <option value="Group Home">Group Home</option>
          <option value="Supported Living">Supported Independent Living</option>
          <option value="family reunification">Family Reunification</option>
          <option value="Youth Program">Youth Program</option>
          <option value="Mental Health Unit">Mental Health Unit</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="weekOf">Week of:</label>
        <input type="date" id="weekOf" />
      </div>
    </div>

    <div class="form-row-horizontal hidden" id="otherProgramContainer">
      <div class="form-group">
        <label for="otherProgram">Other Program Name:</label>
        <input type="text" id="otherProgram" />
      </div>
    </div>
  </div>

  <h2>Daily Behavior and Task Completion Log</h2>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th class="day-col">Day</th>
          <th colspan="3">Chores Completed</th>
          <th colspan="3">Medication Taken</th>
          <th colspan="3">Respectful Behavior</th>
          <th colspan="3">Earned Daily Incentive</th>
          <th>Comments</th>
        </tr>
        <tr>
          <th></th>
          <th>AM</th><th>PM</th><th>N</th>
          <th>AM</th><th>PM</th><th>N</th>
          <th>AM</th><th>PM</th><th>N</th>
          <th>AM</th><th>PM</th><th>N</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="trackerBody"></tbody>
    </table>
  </div>

  <h2>Weekly Summary</h2>
  <table>
    <thead>
      <tr>
        <th>Criteria</th>
        <th>Total Days Met</th>
        <th>Total Daily Earnings</th>
        <th>Bonus Earned</th>
        <th>Total Weekly Incentive</th>
        <th>Balance</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>For All Tasks</td>
        <td><input type="text" id="summary-chores-daysmet" /></td>
        <td><input type="text" id="summary-chores-earnings" /></td>
        <td><input type="text" id="summary-chores-bonus" readonly /></td>
        <td><input type="text" id="summary-chores-total" readonly /></td>
        <td><input type="text" id="summary-chores-balance" readonly title="" /></td>
      </tr>
    </tbody>
  </table>

  <div class="button-container">
    <button onclick="calculateSummary()">Calculate Summary</button>
    <button onclick="saveData()">Save</button>
    <button onclick="saveAndLock()">Save and Lock</button>
    <button onclick="exportPDF()">Export as PDF</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const categories = ["chores", "meds", "behavior", "incentive"];
    const shifts = ["am", "pm", "n"];
    let locked = false;
    const savedData = {};

    function createTable() {
      const tbody = document.getElementById("trackerBody");
      tbody.innerHTML = "";
      days.forEach(day => {
        let row = `<tr><td class="day-col">${day}</td>`;
        categories.forEach(category => {
          shifts.forEach(shift => {
            row += `<td><input id="${day.toLowerCase()}-${category}-${shift}" /></td>`;
          });
        });
        row += `<td><input id="${day.toLowerCase()}-comments" /></td></tr>`;
        tbody.innerHTML += row;
      });
    }

    function toggleOtherProgram() {
      const isOther = document.getElementById("program").value === "Other";
      document.getElementById("otherProgramContainer").classList.toggle("hidden", !isOther);
    }

    function calculateSummary() {
      let daysMet = 0;
      let earnings = 0;

      days.forEach(day => {
        let dayTotal = 0;
        shifts.forEach(shift => {
          const val = parseFloat(document.getElementById(`${day.toLowerCase()}-incentive-${shift}`)?.value) || 0;
          dayTotal += val;
          earnings += val;
        });
        if (dayTotal > 0) {
          daysMet++;
        }
      });

      const bonus = earnings * 0.25;
      const total = earnings + bonus;
      const balance = 20 - total;

      document.getElementById("summary-chores-daysmet").value = daysMet;
      document.getElementById("summary-chores-earnings").value = earnings.toFixed(2);
      document.getElementById("summary-chores-bonus").value = bonus.toFixed(2);
      document.getElementById("summary-chores-total").value = total.toFixed(2);

      const balanceField = document.getElementById("summary-chores-balance");
      balanceField.value = balance.toFixed(2);

      if (balance < 0) {
        balanceField.classList.add("negative-balance");
        balanceField.title = "Alert: Balance is negative!";
      } else {
        balanceField.classList.remove("negative-balance");
        balanceField.title = "";
      }
    }

    function saveData() {
      if (locked) {
        alert("Form is locked. Unlock to make changes.");
        return;
      }
      const inputs = document.querySelectorAll('input[type="text"], input[type="date"], select');
      inputs.forEach(input => {
        savedData[input.id] = input.value;
        input.style.border = "";
        input.title = "";
      });
      alert("Data saved.");
    }

    function saveAndLock() {
      saveData();
      locked = true;
      const inputs = document.querySelectorAll('input[type="text"], input[type="date"], select');
      inputs.forEach(input => {
        input.disabled = true;
        input.style.backgroundColor = "#eee9e2";
      });
      alert("Form saved and locked.");
    }

    function exportPDF() {
      const element = document.body;

      html2canvas(element).then(canvas => {
        const contentWidth = canvas.width;
        const contentHeight = canvas.height;
        const orientation = contentWidth > contentHeight ? 'landscape' : 'portrait';

        const opt = {
          margin: 0.5,
          filename: 'behavior_tracker.pdf',
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2 },
          jsPDF: { unit: 'in', format: 'letter', orientation: orientation }
        };

        html2pdf().set(opt).from(element).save();
      });
    }

    createTable();
  </script>

</body>
</html>
